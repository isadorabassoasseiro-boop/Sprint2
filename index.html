<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Basic Icons -->
<link href="https://cdn.boxicons.com/3.0.8/fonts/basic/boxicons.min.css" rel="stylesheet">
<!-- Filled Icons -->
<link href="https://cdn.boxicons.com/3.0.8/fonts/filled/boxicons-filled.min.css" rel="stylesheet">
<!-- Brand Icons -->
<link href="https://cdn.boxicons.com/3.0.8/fonts/brands/boxicons-brands.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./css/flexbox.css">
    <link rel="stylesheet" href="./css/style.css">

    <title>Câmera</title>
</head>
<body>

<main class="camera">
<img src="./imagens/1_foto_extraida.png" alt="">
    <header class="topo">
       
        <button>
            <i class="bx bx-bolt-alt"></i>
        
        </button>
 
        <button>
            <i class='bx bx-stopwatch'></i>
        </button>

        <button class="texto">
            4:3
        </button>

        <button class="ativo">
            ✨Foto
        </button>

        <button>
            <i class="bx bx-grid-lines"></i>
        </button>

        <button>
            <i class='bx bx-rectangle'></i>
        </button>

        <a href="./configuracao.html">
            <button>
                <i class='bx bx-cog'></i>
            </button>
        </a>
    </header>

        
    <aside class="zoom">

        <button>.5x</button>

        <button> 1x</button>

        <button>2x</button>

        <button>5x</button>

        <button>10x</button>

    </aside>

        
    <section class="modos">

        <button>MAIS</button>

        <a href="./interações/retrato.html">
        <button>RETRATO</button>
</a>
      
        <button class="modo-ativo">FOTO</button>

<a href="./interações/video.html">
        <button>VÍDEO</button>
        </a>

        <a href="./interações/noturno.html">
        <button>NOTURNO</button>
    </a>
    </section>

    <footer class="rodape">
        <a href="./armazenamento.html">
        <button class="galeria">
            <i class='bx bx-image'></i>
        </button>
        </a>

        <button class="captura"></button>
        <a href="./status.html">
        <button class="config">
                <i class='bx bx-slider'></i>
        </button>
        </a>
            
    </footer>

    </main>

</body>
</html>
