<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./css/flexbox.css">
    <link rel="stylesheet" href="./css/style.css">

    <title>Câmera</title>
</head>
<body>

<main class="camera">

    <header class="topo">

        <button>
            <i class='bx bx-bolt'></i>
        </button>

        <button>
            <i class='bx bx-stopwatch'></i>
        </button>

        <button class="texto">
            4:3
        </button>

        <button class="ativo">
            ✨Texto
        </button>

        <button>
            <i class='bx bx-grid-alt'></i>
        </button>

        <button>
            <i class='bx bx-rectangle'></i>
        </button>

        <a href="./configuracao.html">
            <button>
                <i class='bx bx-cog'></i>
            </button>
        </a>
    </header>

        
    <aside class="zoom">

        <button>.5x</button>

        <button> 1x</button>

        <button>2x</button>

        <button>5x</button>

        <button>10x</button>

    </aside>

        
    <section class="modos">

        <button>MAIS</button>
        <button>RETRATO</button>

        <button>FOTO</button>

        <button>VÍDEO</button>
        <button>NOTURNO</button>

    </section>

    <footer class="rodape">
        <a href="./armazenamento.html">
        <button class="galeria">
            <i class='bx bx-image'></i>
        </button>
        </a>

        <button class="captura"></button>
        <a href="./status.html">
        <button class="config">
                <i class='bx bx-slider'></i>
        </button>
        </a>
            
    </footer>

    </main>

</body>
</html>
