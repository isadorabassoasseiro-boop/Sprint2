<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./css/status.css">
    <link rel="stylesheet" href="./css/flexbox.css">
  

    <title>Status do Sistema</title>
</head>

<body>

    <main class="camera">

        
        <header class="topo-status">
            <a href="./index.html">
            <button class="voltar">
                <i class='bx bx-arrow-back'></i>
            </button>
        </a>
            <h1>Status do sistema</h1>

        </header>

        <section class="sistema-card">

            <div class="icone-status">
                <i class='bx bx-check-circle'></i>
            </div>

            <div class="texto-status">
                <h2>Sistema operacional</h2>
                <p>Todos os recursos funcionando</p>
            </div>

        </section>

    
        <section class="recursos">

            <h2>RECURSOS ATIVOS</h2>

            <div class="grid-recursos">

                <div class="recurso-card">

                    <i class='bx bx-star'></i>

                    <h3>IA Ativa</h3>

                    <p>Processando</p>

                </div>

                <div class="recurso-card">

                    <i class='bx bx-image'></i>

                    <h3>Otimização</h3>

                    <p>Ativo</p>

                </div>
                <div class="recurso-card">

                    <i class='bx bx-chip'></i>

                    <h3>Processador</h3>

                    <p>45% uso</p>

                </div>

                <div class="recurso-card">

                    <i class='bx bx-pulse'></i>

                    <h3>Estabilização</h3>

                    <p>Tempo real</p>

                </div>

            </div>

        </section>

    
        <section class="desempenho">

            <h2>DESEMPENHO</h2>

            <div class="desempenho-card">


                <div class="barra-item">

                    <div class="barra-texto">
                        <span>CPU</span>
                        <span>45%</span>
                    </div>

                    <div class="barra">
                        <div class="progresso cpu"></div>
                    </div>

                </div>

    
                <div class="barra-item">

                    <div class="barra-texto">
                        <span>Memória</span>
                        <span>62%</span>
                    </div>

                    <div class="barra">
                        <div class="progresso memoria"></div>
                    </div>

                </div>

    
                <div class="barra-item">

                    <div class="barra-texto">
                        <span>Bateria</span>
                        <span>68%</span>
                    </div>

                    <div class="barra">
                        <div class="progresso bateria"></div>
                    </div>

                </div>

            </div>

        </section>

    </main>

</body>
</html>
